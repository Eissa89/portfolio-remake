<body>

    <!-- استخدام Three.js و GSAP من CDNs موثوقة -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "gsap": "https://unpkg.com/gsap@3.12.5/index.js"

    <script type="module">
        import * as THREE from 'three';
        import gsap from 'gsap';

        // --- الإعدادات المتقدمة ---
        const PARTICLE_COUNT = 8500;   // عدد جسيمات مرتفع لتفاصيل غنية
        let scene, camera, renderer, particleSystem;
        let currentPositionsArray;     // مرجع للمصفوفة الأصلية
        let targetPositionsBuffer;      // المخزن المؤقت للمواقع المستهدفة
        let morphAnimation = null;

        // تحميل الخط (JSON Three.js)
        // استخدام خط Helvetiker متوفر في الأمثلة الرسمية
        const fontUrl = 'https://threejs.org/examples/fonts/helvetiker_regular.typeface.json';

        // متغيرات للنص ثلاثي الأبعاد (Shapes)
        let loadedFont = null;
        let isReady = false;

        // --- عناصر إضافية: تأثير دوران خلفي وإضاءة محيطة لجمالية أكثر ---
        let starField = null;
        let ambientLight, pointLight;

        // دالة لإنشاء خلفية نجوم متحركة (اختيارية)
        function createStarfield() {
            const starGeometry = new THREE.BufferGeometry();
            const starCount = 1200;
            const starPositions = new Float32Array(starCount * 3);
            for (let i = 0; i < starCount; i++) {
                starPositions[i*3] = (Math.random() - 0.5) * 200;
                starPositions[i*3+1] = (Math.random() - 0.5) * 100;
                starPositions[i*3+2] = (Math.random() - 0.5) * 80 - 40;
            }
            starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const starMaterial = new THREE.PointsMaterial({ color: 0x88aaff, size: 0.08, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending });
            const stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);
            return stars;
        }

        // --- تهيئة المشهد بكاميرا ديناميكية وإضاءة ساحرة ---
        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.003); // ضباب خفيف يعمق الإحساس

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 14);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // إضاءة لتعزيز العمق (حتى لو PointsMaterial لا يتأثر كثيرًا، لكن للأجواء)
            ambientLight = new THREE.AmbientLight(0x222222);
            scene.add(ambientLight);
            pointLight = new THREE.PointLight(0x44aaff, 0.8);
            pointLight.position.set(2, 3, 5);
            scene.add(pointLight);
            const backLight = new THREE.PointLight(0xff66cc, 0.4);
            backLight.position.set(-2, 1, -4);
            scene.add(backLight);

            // إضافة نجوم متحركة
            starField = createStarfield();

            // إضافة تأثيرات بصرية دائرية خفيفة (حلقة من الجسيمات الخلفية)
            const glowGeometry = new THREE.BufferGeometry();
            const glowCount = 800;
            const glowPos = [];
            for (let i = 0; i < glowCount; i++) {
                const radius = 3.5 + Math.random() * 1.5;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const x = radius * Math.sin(phi) * Math.cos(theta);
                const y = radius * Math.sin(phi) * Math.sin(theta);
                const z = radius * Math.cos(phi) - 2;
                glowPos.push(x, y, z);
            }
            glowGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(glowPos), 3));
            const glowMaterial = new THREE.PointsMaterial({ color: 0x33aaff, size: 0.03, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending });
            const glowRing = new THREE.Points(glowGeometry, glowMaterial);
            scene.add(glowRing);
        }

        // --- إنشاء نظام الجسيمات الأولي (توزيع عشوائي في فضاء كروي ممتد) ---
        function createInitialParticleSystem() {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            // توزيع عشوائي بشكل بيضوي جميل
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                // شكل كرة ممطوطة
                const radius = 4.5 * Math.cbrt(Math.random()); // توزيع أكثر طبيعية
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const x = radius * Math.sin(phi) * Math.cos(theta);
                const y = radius * Math.sin(phi) * Math.sin(theta) * 0.8;
                const z = radius * Math.cos(phi) * 0.6;
                positions[i*3] = x;
                positions[i*3+1] = y;
                positions[i*3+2] = z;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            // مواد متلألئة بألوان متغيرة حسب العمق (يمكن استخدام عدة ألوان)
            const colors = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const colorChoice = Math.random();
                if (colorChoice < 0.6) {
                    colors[i*3] = 0.0; colors[i*3+1] = 1.0; colors[i*3+2] = 0.8;   // سيان
                } else if (colorChoice < 0.8) {
                    colors[i*3] = 0.8; colors[i*3+1] = 0.2; colors[i*3+2] = 1.0;   // بنفسجي
                } else {
                    colors[i*3] = 1.0; colors[i*3+1] = 0.5; colors[i*3+2] = 0.2;   // برتقالي
                }
            }
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.08,
                vertexColors: true,
                transparent: true,
                opacity: 0.95,
                blending: THREE.AdditiveBlending
            });

            const particles = new THREE.Points(geometry, material);
            scene.add(particles);
            return particles;
        }

        // --- استخراج نقاط من النص ثلاثي الأبعاد (ShapeGeometry) وتحويلها إلى مواقع مستهدفة للجسيمات ---
        function getTargetPositionsFromText(text) {
            if (!loadedFont) {
                console.warn("الخط غير جاهز بعد");
                return null;
            }

            // معالجة النص: تحويل لأحرف كبيرة وإزالة المسافات الزائدة ولكن نحتفظ بالعربية أيضًا
            let displayText = text.trim();
            if (displayText === "") displayText = "ART";
            // الحد الأقصى لعدد الأحرف لتجنب مشاكل الأداء
            if (displayText.length > 12) displayText = displayText.slice(0, 12);

            try {
                // إنشاء أشكال النص
                const shapes = loadedFont.generateShapes(displayText, 1.6, {
                    curveSegments: 32,
                    bevelEnabled: false,
                    bevelThickness: 0.03,
                    bevelSize: 0.02,
                    bevelSegments: 3
                });

                const textGeometry = new THREE.ShapeGeometry(shapes);
                // حساب الأبعاد لتوسيط النص بشكل مثالي
                textGeometry.computeBoundingBox();
                const bbox = textGeometry.boundingBox;
                if (!bbox) return null;

                const width = bbox.max.x - bbox.min.x;
                const height = bbox.max.y - bbox.min.y;
                const centerX = (bbox.min.x + bbox.max.x) / 2;
                const centerY = (bbox.min.y + bbox.max.y) / 2;

                // استخراج جميع نقاط الرؤوس من الهندسة
                const positionAttribute = textGeometry.attributes.position;
                if (!positionAttribute) return null;

                const pointsArray = positionAttribute.array;
                const totalVertices = pointsArray.length / 3;

                if (totalVertices === 0) return null;

                // إنشاء مصفوفة المواقع المستهدفة
                const targetPos = new Float32Array(PARTICLE_COUNT * 3);

                // استراتيجية ذكية: تعيين نقاط النص للجسيمات مع إعادة استخدام النقاط لتحقيق ملء ممتاز
                // سنقوم بتكرار النقاط المتاحة بشكل دوري لضمان تغطية جميع الجسيمات، مع إضافة ضوضاء بسيطة للحصول على كثافة طبيعية
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    // نأخذ النقطة المعيارية مع لف دوري
                    const idx = (i % totalVertices) * 3;
                    let x = pointsArray[idx];
                    let y = pointsArray[idx + 1];
                    let z = pointsArray[idx + 2] || 0;

                    // توسيط النص بدقة عالية
                    x -= centerX;
                    y -= centerY;

                    // إضافة إزاحة عشوائية صغيرة جدًا لتجنب الاصطفاف الدقيق المفرط وزيادة الكثافة
                    // ولكن بشكل خفيف للحفاظ على شكل الحروف
                    if (Math.random() < 0.3) {
                        x += (Math.random() - 0.5) * 0.045;
                        y += (Math.random() - 0.5) * 0.045;
                        z += (Math.random() - 0.5) * 0.03;
                    }

                    targetPos[i*3] = x;
                    targetPos[i*3+1] = y;
                    targetPos[i*3+2] = z * 0.8; // عمق بسيط
                }

                // إضافة طبقة ثانية: نأخذ بعض الجسيمات العشوائية لتوزع بشكل أكثر واقعية حول الحواف
                // هذا يحسن المظهر البصري بشكل كبير
                for (let i = 0; i < PARTICLE_COUNT * 0.15; i++) {
                    const randIdx = Math.floor(Math.random() * PARTICLE_COUNT);
                    const randVertex = Math.floor(Math.random() * totalVertices) * 3;
                    const xOff = (Math.random() - 0.5) * 0.12;
                    const yOff = (Math.random() - 0.5) * 0.12;
                    targetPos[randIdx*3] = pointsArray[randVertex] - centerX + xOff;
                    targetPos[randIdx*3+1] = pointsArray[randVertex+1] - centerY + yOff;
                    targetPos[randIdx*3+2] = (pointsArray[randVertex+2] || 0) * 0.8 + (Math.random() - 0.5) * 0.1;
                }

                return targetPos;
            } catch (err) {
                console.error("خطأ في إنشاء هندسة النص:", err);
                return null;
            }
        }

        // --- وظيفة التحويل الرئيسية مع حركة سلسة ورد فعل بصري ---
        function morphToText(text) {
            if (!loadedFont || !particleSystem) {
                console.warn("الخط أو النظام غير جاهز");
                return;
            }

            const targetPositions = getTargetPositionsFromText(text);
            if (!targetPositions) {
                console.warn("فشل إنشاء مواقع النص المستهدف");
                return;
            }

            // الحصول على الموضع الحالي للجسيمات
            const currentAttr = particleSystem.geometry.attributes.position;
            const currentPos = currentAttr.array;

            // إنشاء نسخة لتحديثها تدريجيًا (نستخدم gsap على مصفوفة عادية)
            // لتجنب مشاكل التحديث، نستخدم gsap لتغيير القيم داخل array ثم تحديث needsUpdate
            // نسخ القيم الحالية إلى مصفوفة مؤقتة يمكن لـ GSAP التلاعب بها
            const tempArray = new Float32Array(currentPos.length);
            tempArray.set(currentPos);

            // إيقاف أي تحريك سابق لضمان سلاسة
            if (morphAnimation) {
                morphAnimation.kill();
            }

            // تأثير إضافي: تغيير لون الجسيمات أثناء التحول (تأثير متدرج)
            const colorAttr = particleSystem.geometry.attributes.color;
            if (colorAttr) {
                const currentColors = colorAttr.array;
                const newColors = new Float32Array(currentColors.length);
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    // تدرج نحو ألوان زاهية: أزرق سماوي ووردي
                    const mixFactor = Math.sin(i * 0.002) * 0.5 + 0.5;
                    newColors[i*3] = 0.2 + Math.random() * 0.8;     // R
                    newColors[i*3+1] = 0.5 + Math.random() * 0.5;   // G
                    newColors[i*3+2] = 0.8 + Math.random() * 0.2;   // B
                }
                gsap.to(currentColors, {
                    endArray: newColors,
                    duration: 1.2,
                    ease: "power2.inOut",
                    onUpdate: () => { colorAttr.needsUpdate = true; }
                });
            }

            // تحريك الجسيمات نحو النص الجديد
            morphAnimation = gsap.to(tempArray, {
                endArray: targetPositions,
                duration: 1.6,
                ease: "back.out(0.4)",
                onUpdate: () => {
                    // نسخ القيم من tempArray إلى currentPos
                    for (let i = 0; i < currentPos.length; i++) {
                        currentPos[i] = tempArray[i];
                    }
                    currentAttr.needsUpdate = true;
                },
                onComplete: () => {
                    // ضمان الدقة النهائية
                    for (let i = 0; i < currentPos.length; i++) {
                        currentPos[i] = targetPositions[i];
                    }
                    currentAttr.needsUpdate = true;
                }
            });

            // تأثير صوتي بصري: وميض خفيف على الكاميرا (اهتزاز صغير)
            gsap.to(camera.position, {
                z: 13.6,
                duration: 0.2,
                yoyo: true,
                repeat: 1,
                ease: "power1",
                onComplete: () => { camera.position.z = 14; }
            });
        }

        // --- إنشاء تأثير دوران وتفاعل مع الماوس خفيف (إمالة) ---
        let mouseX = 0, mouseY = 0;
        let targetRotationX = 0, targetRotationY = 0;

        function initMouseEffect() {
            window.addEventListener('mousemove', (event) => {
                mouseX = (event.clientX / window.innerWidth) * 2 - 1;
                mouseY = (event.clientY / window.innerHeight) * 2 - 1;
                targetRotationY = mouseX * 0.2;
                targetRotationX = mouseY * 0.1;
            });
        }

        // --- وظيفة التحريك الأساسية مع دوران المجموعة وتأثير النجوم ---
        function animate() {
            requestAnimationFrame(animate);

            // دوران خفيف لنظام الجسيمات بتأثير الماوس مع دوران ذاتي بسيط
            if (particleSystem) {
                // دوران سلس مستجيب للماوس
                particleSystem.rotation.y += (targetRotationY - particleSystem.rotation.y) * 0.05;
                particleSystem.rotation.x += (targetRotationX * 0.5 - particleSystem.rotation.x) * 0.05;
                // دوران ذاتي بطيء جدًا
                particleSystem.rotation.z += 0.0005;
            }

            // تحريك النجوم الخلفية بشكل بطيء
            if (starField) {
                starField.rotation.y += 0.0002;
                starField.rotation.x += 0.0001;
            }

            // كاميرا ديناميكية طفيفة بناءً على الماوس
            const targetCamX = targetRotationY * 0.3;
            const targetCamY = targetRotationX * 0.2;
            camera.position.x += (targetCamX - camera.position.x) * 0.05;
            camera.position.y += (-targetCamY - camera.position.y) * 0.05;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // --- تحميل الخط وبدء التشغيل ---
        const fontLoader = new THREE.FontLoader();
        fontLoader.load(fontUrl, (fontData) => {
            loadedFont = fontData;
            console.log("تم تحميل الخط بنجاح");
            isReady = true;

            // تهيئة كل العناصر
            initScene();
            particleSystem = createInitialParticleSystem();
            currentPositionsArray = particleSystem.geometry.attributes.position.array;

            // إعداد حدث الزر
            const morphBtn = document.getElementById('morphBtn');
            const textInput = document.getElementById('textInput');

            morphBtn.addEventListener('click', () => {
                let inputText = textInput.value;
                if (inputText === "") inputText = "FUTURE";
                morphToText(inputText);
            });

            // تحويل أولي افتراضي لجذب الانتباه (كلمة افتراضية)
            setTimeout(() => {
                morphToText(textInput.value || "3D ART");
            }, 400);

            // تأثير الماوس
            initMouseEffect();
            animate();
        }, undefined, (error) => {
            console.error("فشل تحميل الخط:", error);
            // في حال فشل تحميل الخط، نعرض رسالة بسيطة ونستخدم خطًا احتياطيًا غير متاح، لكن نضيف تجربة بديلة
            document.body.style.backgroundColor = "#000";
            const fallbackMsg = document.createElement('div');
            fallbackMsg.style.position = 'absolute';
            fallbackMsg.style.bottom = '20%';
            fallbackMsg.style.left = '0';
            fallbackMsg.style.right = '0';
            fallbackMsg.style.textAlign = 'center';
            fallbackMsg.style.color = '#0ff';
            fallbackMsg.style.fontFamily = 'monospace';
            fallbackMsg.innerText = 'جاري تهيئة المؤثرات ثلاثية الأبعاد... يرجى إعادة المحاولة';
            document.body.appendChild(fallbackMsg);
            // محاولة تهيئة أساسية بدون خط
            initScene();
            particleSystem = createInitialParticleSystem();
            animate();
        });

        // معالجة تغيير حجم الشاشة
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // إضافة تأثير نبضات لونية مستمرة اختياريًا (تحسين)
        setInterval(() => {
            if (particleSystem && particleSystem.material) {
                const mat = particleSystem.material;
                gsap.to(mat, {
                    duration: 1.2,
                    opacity: 0.85,
                    yoyo: true,
                    repeat: 1,
                    ease: "sine.inOut"
                });
            }
        }, 3000);
    </script>
