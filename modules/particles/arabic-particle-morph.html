<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Arabic Particle Morphing</title>
    <style>
        body { margin: 0; overflow: hidden; background: #00050a; font-family: sans-serif; }
        canvas { display: block; }
        .ui {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; z-index: 10; background: rgba(255,255,255,0.05);
            padding: 15px; border-radius: 50px; backdrop-filter: blur(10px);
            border: 1px solid rgba(0,255,200,0.3);
        }
        input {
            background: transparent; border: 1px solid #0ff; border-radius: 25px;
            padding: 10px 20px; color: #0ff; outline: none; text-align: center;
            font-size: 1.1rem; width: 200px;
        }
        button {
            background: #0ff; color: #000; border: none; padding: 10px 25px;
            border-radius: 25px; cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        button:hover { background: #fff; box-shadow: 0 0 20px #0ff; }
        #status {
            position: absolute; top: 20px; width: 100%; text-align: center;
            color: rgba(0,255,200,0.5); font-size: 0.9rem; letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div id="status">جاري معالجة خط عارف رقعة...</div>
<div class="ui">
    <input type="text" id="textInput" placeholder="اكتب بالعربي..." value="إبداع">
    <button id="morphBtn">تحويل</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opentype.js@latest/dist/opentype.min.js"></script>

<script type="module">
    let scene, camera, renderer, particles, font;
    const particleCount = 15000;
    let targetPositions = new Float32Array(particleCount * 3);
    const mouse = new THREE.Vector2(-100, -100);

    // 1. تحميل الخط المرفوع (aref-regular.ttf)
    // ملاحظة: استبدل الرابط أدناه بمسار الملف الفعلي في بيئتك
    opentype.load('aref-regular.ttf', (err, f) => {
        if (err) {
            document.getElementById('status').innerText = "خطأ في تحميل الخط";
            return;
        }
        font = f;
        document.getElementById('status').innerText = "تم تفعيل محرك الخطوط العربية";
        init();
    });

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 12;

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // إنشاء جسيمات عشوائية
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(particleCount * 3);
        for(let i=0; i<particleCount*3; i++) pos[i] = (Math.random() - 0.5) * 20;
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

        const mat = new THREE.PointsMaterial({
            size: 0.06,
            color: 0x00ffff,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        particles = new THREE.Points(geo, mat);
        scene.add(particles);

        createHologram(document.getElementById('textInput').value);
        animate();
    }

    function createHologram(text) {
        // تحويل النص العربي لمسار هندسي
        const fontSize = 4;
        const path = font.getPath(text, 0, 0, fontSize);
        const shapes = new THREE.ShapePath();
        // محاكاة تحويل Opentype Path إلى Three.js Shapes
        // (تبسيطاً لهذه النسخة سنستخدم الـ Bounding Box لتوزيع النقاط داخل الكلمة)
        const bbox = path.getBoundingBox();
        const width = bbox.x2 - bbox.x1;
        const height = bbox.y2 - bbox.y1;

        // استخراج النقاط من مسار الخط
        const fontPoints = [];
        const samples = font.getPaths(text, 0, 0, fontSize);

        samples.forEach(p => {
            const pPoints = p.toShapes(true);
            pPoints.forEach(shape => {
                const pts = shape.getSpacedPoints(100);
                pts.forEach(v => fontPoints.push(v));
            });
        });

        const newPositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            const i3 = i * 3;
            const p = fontPoints[i % fontPoints.length];
            newPositions[i3] = p.x - (width / 2);
            newPositions[i3+1] = p.y + (height / 2);
            newPositions[i3+2] = (Math.random() - 0.5) * 0.5; // عمق بسيط
        }

        gsap.to(particles.geometry.attributes.position.array, {
            endArray: newPositions,
            duration: 2,
            ease: "expo.inOut",
            onUpdate: () => particles.geometry.attributes.position.needsUpdate = true
        });
    }

    function animate() {
        requestAnimationFrame(animate);

        // تفاعل بسيط مع الماوس (تحريك خفيف)
        particles.rotation.y += 0.002;
        particles.rotation.x += (mouse.y * 0.1 - particles.rotation.x) * 0.05;

        renderer.render(scene, camera);
    }

    window.addEventListener('mousemove', (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    document.getElementById('morphBtn').onclick = () => {
        createHologram(document.getElementById('textInput').value);
    };
</script>
</body>
</html>
