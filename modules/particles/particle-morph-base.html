<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Particle Morphing</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>

<script>
    let scene, camera, renderer, particles;
    const particleCount = 5000;
    let sphereVertices = [];
    let boxVertices = [];

    init();
    animate();

    function init() {
        // 1. إعداد المشهد والكاميرا
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. إنشاء نقاط الشكل (الكرة)
        const sphereGeom = new THREE.SphereGeometry(2, 64, 64);
        const spherePositions = sphereGeom.attributes.position.array;
        for (let i = 0; i < particleCount * 3; i++) {
            sphereVertices.push(spherePositions[i] || (Math.random() - 0.5) * 4);
        }

        // 3. إنشاء نقاط الشكل (الصندوق)
        const boxGeom = new THREE.BoxGeometry(3, 3, 3, 30, 30, 30);
        const boxPositions = boxGeom.attributes.position.array;
        for (let i = 0; i < particleCount * 3; i++) {
            boxVertices.push(boxPositions[i] || (Math.random() - 0.5) * 3);
        }

        // 4. إعداد الجسيمات في المشهد
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(sphereVertices);
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const material = new THREE.PointsMaterial({
            color: 0x00ffcc,
            size: 0.02,
            transparent: true,
            opacity: 0.8
        });

        particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // 5. وظيفة التحول (Morphing) باستخدام GSAP
        function morph(targetArray) {
            const currentPositions = particles.geometry.attributes.position.array;
            gsap.to(currentPositions, {
                endArray: targetArray,
                duration: 2,
                ease: "power2.inOut",
                onUpdate: () => {
                    particles.geometry.attributes.position.needsUpdate = true;
                },
                onComplete: () => {
                    // التبديل بين الأشكال بشكل دوري
                    setTimeout(() => {
                        morph(targetArray === sphereVertices ? boxVertices : sphereVertices);
                    }, 2000);
                }
            });
        }

        morph(boxVertices);
    }

    function animate() {
        requestAnimationFrame(animate);
        particles.rotation.y += 0.005; // دوران خفيف لإضافة عمق
        renderer.render(scene, camera);
    }

    // التعامل مع تغيير حجم النافذة
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
